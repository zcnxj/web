<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试主页 | GitHub Pages + Cloudflare</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #165DFF, #36CFC9);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(12px);
            padding: 48px 32px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            max-width: 520px;
            width: 100%;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 16px;
        }
        p {
            font-size: 1rem;
            line-height: 1.7;
            opacity: 0.92;
            margin-bottom: 24px;
        }
        .ok-tag {
            display: inline-block;
            background: #ffffff33;
            padding: 8px 16px;
            border-radius: 999px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎉 站点连通测试成功</h1>
        <p>
            如果你能看到这个页面，说明：<br>
            GitHub Pages 部署正常，域名解析链路通了
        </p>
        <div class="ok-tag">当前测试页面 index.html</div>
    </div>
</body>
</html>
